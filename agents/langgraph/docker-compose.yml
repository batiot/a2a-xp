services:
  langgraph-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10002:8000"
    environment:
      GOOGLE_STUDIO_API_KEY: ${GOOGLE_STUDIO_API_KEY:?GOOGLE_STUDIO_API_KEY is required}
      # google-genai / langchain-google-genai also read GOOGLE_API_KEY
      GOOGLE_API_KEY: ${GOOGLE_STUDIO_API_KEY}
      AGENT_URL: ${AGENT_URL:-http://langgraph-agent:8000}
    networks:
      - a2a-net
    profiles:
      - langgraph
    restart: unless-stopped

networks:
  a2a-net:
    name: a2a-net
    driver: bridge
